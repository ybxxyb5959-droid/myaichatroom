<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141820"><meta name="referrer" content="no-referrer">
<title>AI 단톡방 입장</title><link rel="stylesheet" href="/share.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"></head>
<body class="phone-page"><main class="phone-card"><h1 id="joinTitle">이름이 무엇인가요?</h1>
<p id="joinNote">이름을 입력하면 친구로 입장합니다. 별도 회원가입은 필요 없습니다.</p>
<form id="joinForm"><label id="nameLabel">대화에 표시할 이름<input id="joinName" maxlength="24" autocomplete="nickname" required></label>
<button id="joinSubmit">입장하기</button></form><p id="joinError" class="share-error" role="alert"></p>
<p class="share-note">Tailscale이 연결되어 있어야 합니다. 입장 후 홈 화면에 앱을 추가할 수 있습니다.</p></main>
<script type="module" src="/join.js"></script><script type="module" src="/pwa.js"></script></body></html>
